name: Android APK Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository (native git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"

      - name: Runtime information
        run: |
          node --version
          npm --version
          java -version
          gh --version

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build installable Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare public release asset
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/VJR221.apk
          ls -lh release/VJR221.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${GITHUB_SHA::12}"
          gh release create "$TAG" release/VJR221.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "VJR221 Android APK ${GITHUB_SHA::7}" \
            --notes "APK Android installable de VJR221. Build généré automatiquement depuis le commit ${GITHUB_SHA}." \
            --prerelease
