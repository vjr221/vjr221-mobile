name: Android APK Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository (native git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"

      - name: Configure Java 17
        run: |
          JAVA17_HOME="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
          echo "JAVA_HOME=$JAVA17_HOME" >> "$GITHUB_ENV"
          echo "$JAVA17_HOME/bin" >> "$GITHUB_PATH"
          java -version

      - name: Runtime information
        run: |
          node --version
          npm --version
          java -version
          gh --version

      - name: Install dependencies
        run: npm install

      - name: Use official VJR 221 app icon
        run: |
          curl --fail --location --retry 3 --retry-delay 2 "https://vjr221.sn/wp-content/uploads/2026/08/app-mobile-1024x1024-1.png" --output assets/icon.png
          file assets/icon.png
          test -s assets/icon.png

      - name: Quality gates
        env:
          EXPO_PUBLIC_APP_ENV: production
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Generate Android project
        env:
          EXPO_PUBLIC_APP_ENV: production
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build production Android APK with embedded JS bundle
        env:
          EXPO_PUBLIC_APP_ENV: production
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --no-parallel

      - name: Verify production bundle is embedded
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q "assets/index.android.bundle"

      - name: Verify launcher icon resources
        run: |
          test -f assets/icon.png
          find android/app/src/main/res -type f \( -name "*launcher*" -o -name "*icon*" \) -print | head -80

      - name: Prepare public release asset
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/VJR221.apk
          sha256sum release/VJR221.apk | tee release/VJR221.apk.sha256

      - name: Extract Android signing certificate fingerprint
        run: |
          CERT_SHA256="$(keytool -printcert -jarfile release/VJR221.apk | awk -F": " '/SHA256:/{print $2; exit}')"
          test -n "$CERT_SHA256"
          echo "ANDROID_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"
          echo "Android signing certificate SHA-256: $CERT_SHA256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v1.2.0-${GITHUB_SHA::7}"
          NOTES="APK Android de production VJR 221 — version 1.2.0. Build généré depuis le commit ${GITHUB_SHA}.\n\nEmpreinte SHA-256 du certificat de signature Android : ${ANDROID_CERT_SHA256}"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing release assets."
            gh release upload "$TAG" release/VJR221.apk release/VJR221.apk.sha256 --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "$TAG" release/VJR221.apk release/VJR221.apk.sha256 --repo "${GITHUB_REPOSITORY}" --title "VJR 221 Android 1.2.0" --notes "$NOTES" --prerelease
          fi
