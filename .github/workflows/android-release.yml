name: Android APK Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository (native git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"

      - name: Runtime information
        run: |
          node --version
          npm --version
          java -version
          gh --version

      - name: Install dependencies
        run: npm ci

      - name: Use official VJR 221 app icon
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://vjr221.sn/wp-content/uploads/2026/08/app-mobile-1024x1024-1.png" \
            --output assets/icon.png
          file assets/icon.png
          test -s assets/icon.png
          ls -lh assets/icon.png

      - name: Quality gates
        env:
          EXPO_PUBLIC_APP_ENV: production
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Generate Android project
        env:
          EXPO_PUBLIC_APP_ENV: production
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build production Android APK with embedded JS bundle
        env:
          EXPO_PUBLIC_APP_ENV: production
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify production bundle is embedded
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E 'assets/index\.android\.bundle|assets/index\.android.bundle.packager.map' || true
          if ! unzip -l "$APK" | grep -q 'assets/index\.android\.bundle'; then
            echo "ERROR: index.android.bundle is missing from the release APK"
            exit 1
          fi

      - name: Verify launcher icon resources
        run: |
          test -f assets/icon.png
          ls -lh assets/icon.png
          find android/app/src/main/res -type f \( -name '*launcher*' -o -name '*icon*' \) -print | head -80

      - name: Prepare public release asset
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/VJR221.apk
          sha256sum release/VJR221.apk | tee release/VJR221.apk.sha256
          ls -lh release/VJR221.apk release/VJR221.apk.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${GITHUB_SHA::12}"
          gh release create "$TAG" release/VJR221.apk release/VJR221.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "VJR221 Android APK ${GITHUB_SHA::7}" \
            --notes "APK Android de production VJR221. Le bundle JavaScript est embarqué dans l'APK et l'icône officielle de la médiathèque VJR 221 est utilisée. Build généré depuis le commit ${GITHUB_SHA}." \
            --prerelease
