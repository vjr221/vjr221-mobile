name: Promote Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de la release à promouvoir (ex. android-v1.6.0-1ea26db)
        required: true
        default: android-v1.6.0-1ea26db

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote to latest stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          echo "Promoting $TAG → latest (prerelease=false)"
          RELEASE_JSON="$(gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json name,tagName)"
          RELEASE_NAME="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.name)' "$RELEASE_JSON")"
          gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --prerelease=false --latest             --notes "$RELEASE_NAME. Release publique sideload."
          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json tagName,isPrerelease,url
