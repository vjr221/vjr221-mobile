name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches:
      - mobile/phase6-integration
  pull_request:

permissions:
  contents: write

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository (native git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
      - name: Runtime information
        run: |
          node --version
          npm --version
          git --version
          java -version
      - name: Synchronize npm lockfile
        if: github.event_name == 'push' && github.ref_name == 'mobile/phase6-integration'
        run: |
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "ci: synchronize npm lockfile with Phase 6 dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Expo Android export
        run: npx expo export --platform android --output-dir .expo-export-check
      - name: Build installable Android APK
        run: |
          npx expo prebuild --platform android --no-install --non-interactive
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare APK artifact
        run: |
          mkdir -p .ci-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk .ci-artifacts/VJR221.apk
          sha256sum .ci-artifacts/VJR221.apk | tee .ci-artifacts/VJR221.apk.sha256
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VJR221-Android-Debug
          path: .ci-artifacts/*
          if-no-files-found: error
          retention-days: 7
