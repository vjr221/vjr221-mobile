name: Mobile CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository (native git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
      - name: Runtime information
        run: |
          node --version
          npm --version
          git --version
          java -version
      - name: Align package-lock integrities with registry
        run: |
          python3 <<'PY'
          import json, urllib.request
          path = "package-lock.json"
          with open(path) as f:
              lock = json.load(f)
          names = ("mdn-data", "yaml", "lint-staged")
          changed = 0
          for key, meta in list(lock.get("packages", {}).items()):
              name = key.split("node_modules/")[-1]
              if name not in names:
                  continue
              ver = meta.get("version")
              if not ver:
                  continue
              url = f"https://registry.npmjs.org/{name}/{ver}"
              with urllib.request.urlopen(url, timeout=30) as r:
                  reg = json.load(r)["dist"]["integrity"]
              if meta.get("integrity") != reg:
                  print(f"update {name}@{ver}")
                  meta["integrity"] = reg
                  changed += 1
          if changed:
              with open(path, "w") as f:
                  json.dump(lock, f, indent=2)
                  f.write("\n")
          print(f"integrity entries updated: {changed}")
          PY
      - name: Install dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          if ! npm ci --no-audit --no-fund; then
            echo "::warning::npm ci failed (possible integrity drift) — falling back to npm install"
            npm cache clean --force
            npm install --no-audit --no-fund
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Expo Android export
        run: npx expo export --platform android --output-dir .expo-export-check
      - name: Build installable Android APK
        env:
          CI: "1"
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare APK artifact
        run: |
          mkdir -p ci-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk ci-artifacts/VJR221.apk
          sha256sum ci-artifacts/VJR221.apk | tee ci-artifacts/VJR221.apk.sha256
      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VJR221-Android-Debug
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 7
